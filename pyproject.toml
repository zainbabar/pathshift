[project]
name = "shiftmon"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "Zain Babar" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "medmnist>=3.0",
    "numpy>=1.26",
    "optuna>=5.0.0",
    "torch>=2.4",
    "torchmetrics>=1.9.0",
    "torchvision>=0.19",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
